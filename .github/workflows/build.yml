name: Derle (Windows x64)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: MSBuild kur
        uses: microsoft/setup-msbuild@v2

      - name: Derle (Release x64)
        run: msbuild PrismTextureStreamerFB.sln /m /p:Configuration=Release /p:Platform=x64 /p:WindowsTargetPlatformVersion=10.0

      - name: DLL'yi bul
        shell: pwsh
        run: |
          $dll = Get-ChildItem -Recurse -Filter PrismTextureStreamerFB.dll | Where-Object { $_.FullName -match 'Release' } | Select-Object -First 1
          if (-not $dll) { Write-Error "DLL bulunamadi"; exit 1 }
          Write-Host "Bulundu: $($dll.FullName)"
          New-Item -ItemType Directory -Force -Path out | Out-Null
          Copy-Item $dll.FullName out/

      - name: DLL'yi yukle
        uses: actions/upload-artifact@v4
        with:
          name: PrismTextureStreamerFB-TR
          path: out/PrismTextureStreamerFB.dll
