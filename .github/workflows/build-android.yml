name: Build Android (arm64, targetSdk 36)

# Repo duzeni:
#   ExportedProject/   (AssetRipper ciktisi)
#   tools/             (prepare.py, BuildScript.cs, overlay/)
#   .github/workflows/build-android.yml
#
# Gerekli secret'lar: UNITY_LICENSE (Personal .ulf icerigi), UNITY_EMAIL, UNITY_PASSWORD

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unity 4.7 -> 6 hazirlik
        run: python3 tools/prepare.py ExportedProject

      - uses: actions/cache@v4
        with:
          path: ExportedProject/Library
          key: Library-Android-${{ hashFiles('ExportedProject/Assets/**', 'ExportedProject/Packages/**') }}
          restore-keys: Library-Android-

      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: ExportedProject
          unityVersion: 6000.0.46f1
          targetPlatform: Android
          androidExportType: androidPackage
          androidTargetSdkVersion: AndroidApiLevel36
          buildMethod: BuildScript.Build
          allowDirtyBuild: true
          versioning: None

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-build
          path: build/Android
          if-no-files-found: ignore
