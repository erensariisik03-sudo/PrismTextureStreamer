name: Hazirla ve prepared dalina gonder

# Unity Build Automation (bulut) 'prepared' dalini derler.
# Bu workflow prepare.py'yi calistirir ve sonucu 'prepared' dalina yazar.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Teshis (hangi dosya calisiyor)
        run: |
          echo "Dal: $(git rev-parse --abbrev-ref HEAD)  Commit: $(git rev-parse --short HEAD)"
          echo "prepare.py son degisiklik:"; git log -1 --format='%h %ci %s' -- tools/prepare.py
          echo "prepare.py boyut/md5: $(wc -c < tools/prepare.py) $(md5sum tools/prepare.py | cut -c1-8)"
          echo "xcode_klasoru geciyor mu: $(grep -c xcode_klasoru tools/prepare.py)"
          echo "Diger prepare.py dosyalari:"; find . -name "prepare.py" -not -path "./.git/*"
          echo "AssemblyInfo sayisi (ham proje): $(find ExportedProject -name 'AssemblyInfo.cs' | wc -l)"

      - name: Unity 4.7 -> 6 hazirlik
        run: python3 tools/prepare.py ExportedProject

      - name: prepared dalina yaz
        run: |
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout -B prepared
          git add -A
          git commit -m "prepared: Unity 6 gecis" || true
          git push -f origin prepared
