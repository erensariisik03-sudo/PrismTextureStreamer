name: Extract APK

# Repo kokune game.apk koy, sonra Actions > Extract APK > Run workflow.
# Cikti: "extracted" artifact'i (decompile C#, manifest, asset dokumu).

on:
  workflow_dispatch:

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Araclari kur
        run: |
          dotnet tool install -g ilspycmd
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
          pip install UnityPy
          sudo apt-get update && sudo apt-get install -y apktool

      - name: APK ac
        run: |
          mkdir -p work/raw out
          unzip -q game.apk -d work/raw
          apktool d -f game.apk -o out/apktool || true
          cp work/raw/assets/bin/Data/Managed/*.dll out/ 2>/dev/null || true

      - name: C# decompile (oyun mantigi)
        run: |
          mkdir -p out/src
          for d in Assembly-CSharp Assembly-CSharp-firstpass Assembly-UnityScript; do
            f=work/raw/assets/bin/Data/Managed/$d.dll
            [ -f "$f" ] && ilspycmd -p -o out/src/$d "$f" || true
          done

      - name: Asset dokumu (mesh, doku, ses, prefab listesi)
        run: |
          cat > work/dump.py <<'EOF'
          import os, sys, UnityPy
          src = "work/raw/assets/bin/Data"
          dst = "out/assets"
          os.makedirs(dst, exist_ok=True)
          log = open("out/assets_log.txt", "w")
          for fn in sorted(os.listdir(src)):
              p = os.path.join(src, fn)
              if not os.path.isfile(p) or os.path.getsize(p) < 64:
                  continue
              try:
                  env = UnityPy.load(p)
              except Exception as e:
                  log.write(f"SKIP {fn}: {e}\n"); continue
              for o in env.objects:
                  t = o.type.name
                  try:
                      d = o.read()
                      name = getattr(d, "name", None) or f"{o.path_id}"
                      log.write(f"{fn}\t{t}\t{name}\n")
                      base = os.path.join(dst, t)
                      os.makedirs(base, exist_ok=True)
                      safe = "".join(c if c.isalnum() or c in "-_." else "_" for c in name)[:80]
                      if t in ("Texture2D", "Sprite"):
                          d.image.save(os.path.join(base, f"{fn[:8]}_{safe}.png"))
                      elif t == "Mesh":
                          open(os.path.join(base, f"{fn[:8]}_{safe}.obj"), "w").write(d.export())
                      elif t == "AudioClip":
                          for k, v in d.samples.items():
                              open(os.path.join(base, f"{fn[:8]}_{k}"), "wb").write(v)
                      elif t in ("TextAsset", "Shader"):
                          open(os.path.join(base, f"{fn[:8]}_{safe}.txt"), "wb").write(
                              d.script if hasattr(d, "script") else b"")
                  except Exception as e:
                      log.write(f"ERR {fn}\t{t}\t{e}\n")
          EOF
          python work/dump.py || true

      - uses: actions/upload-artifact@v4
        with:
          name: extracted
          path: out/
          retention-days: 7
