name: AssetRipper Project

# Repo kokune game.apk koy. Calistir: Actions > AssetRipper Project > Run workflow
# Cikti: "unity_project" artifact'i (sahneler, prefab, materyal, doku, mesh).

on:
  workflow_dispatch:

jobs:
  rip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: AssetRipper indir
        run: |
          mkdir ar && cd ar
          gh release view --repo AssetRipper/AssetRipper --json tagName,assets \
            --jq '.tagName, (.assets[].name)'
          NAME=$(gh release view --repo AssetRipper/AssetRipper --json assets \
            --jq '[.assets[].name | select(test("linux.*(x64|amd64)"; "i"))][0]')
          echo "Secilen: $NAME"
          gh release download --repo AssetRipper/AssetRipper --pattern "$NAME" --clobber
          case "$NAME" in
            *.zip) unzip -q "$NAME" ;;
            *.tar.gz|*.tgz) tar xzf "$NAME" ;;
            *.tar.xz) tar xJf "$NAME" ;;
          esac
          BIN=$(find . -maxdepth 2 -type f -name "AssetRipper*" ! -name "*.zip" ! -name "*.tar.*" ! -name "*.tgz" ! -name "*.dll" ! -name "*.pdb" ! -name "*.json" | head -1)
          ls -la . | head -30
          echo "Calistirilabilir: $BIN"
          chmod +x "$BIN"
          echo "$PWD/$BIN" > ../ar_bin.txt
        env:
          GH_TOKEN: ${{ github.token }}

      - name: APK ac
        run: |
          mkdir -p raw && unzip -q game.apk -d raw

      - name: AssetRipper calistir (headless)
        run: |
          BIN="$(cat ar_bin.txt)"
          cd "$(dirname "$BIN")"
          "$BIN" --help 2>&1 | head -40 || true
          echo "=== baslatiliyor ==="
          "$BIN" --port 5555 --headless > "$GITHUB_WORKSPACE/ar.log" 2>&1 &
          PID=$!
          UP=0
          for i in $(seq 1 60); do
            if curl -s -o /dev/null localhost:5555; then UP=1; break; fi
            kill -0 $PID 2>/dev/null || break
            sleep 2
          done
          echo "=== ar.log ==="; cat "$GITHUB_WORKSPACE/ar.log" | head -60
          [ "$UP" = 1 ] || { echo "SUNUCU ACILMADI"; exit 1; }
          curl -s -X POST localhost:5555/LoadFolder --data-urlencode "path=$GITHUB_WORKSPACE/raw/assets/bin/Data"
          curl -s -X POST localhost:5555/Export/UnityProject \
            --data-urlencode "path=$GITHUB_WORKSPACE/unity_project" \
            --data-urlencode "createSubfolder=false"
          sleep 5
          echo "=== ar.log (son) ==="; tail -n 60 "$GITHUB_WORKSPACE/ar.log"
        timeout-minutes: 60

      - name: Log
        if: always()
        run: tail -n 80 ar.log || true; du -sh unity_project || true

      - uses: actions/upload-artifact@v4
        with:
          name: unity_project
          path: unity_project/
          retention-days: 7
